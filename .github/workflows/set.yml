name: FFmpeg Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg bc

      - name: Download Video
        run: |
          wget -O input.mp4 "https://v1.pinimg.com/videos/mc/720p/da/68/d9/da68d926f31eb7a2e977d2e69c23719d.mp4"

      - name: Get Duration
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 input.mp4)
          NEW_DURATION=$(echo "$DURATION-3" | bc)
          echo "NEW_DURATION=$NEW_DURATION" >> $GITHUB_ENV

      - name: Process Video
        run: |
          ffmpeg -y \
          -i input.mp4 \
          -t $NEW_DURATION \
          -vf "crop=iw*0.98:ih*0.98:(iw-iw*0.98)/2:(ih-ih*0.98)/2,scale=iw:ih" \
          -c:v libx264 \
          -crf 20 \
          -preset medium \
          -c:a aac \
          -b:a 192k \
          output.mp4

      - name: Create Release Tag
        id: tag
        run: |
          TAG=test-$(date +%s)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: output.mp4
